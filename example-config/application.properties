# Template of all the configuration properties that are evaluated by the Peppol Directory client.
# All values below are dummy values - copy the entries you need into your "application.properties".
# See https://github.com/phax/ph-commons/wiki/ph-config for the configuration resolution logic.

## Key store with the SMP key - required to talk to the Directory indexer via https

# Can be "jks" or "pkcs12" (case insensitive).
# Mandatory since v1.0.0 - up to v0.19.1 this defaulted to "jks"
pdclient.keystore.type         = pkcs12
pdclient.keystore.path         = smp-test.p12
pdclient.keystore.password     = password
pdclient.keystore.key.alias    = cert
pdclient.keystore.key.password = password

## Trust store with the certificates of the Directory server

# Mandatory since v1.0.0 - it is needed even if no trust store path is configured
pdclient.truststore.type     = pkcs12
# For the test Directory
pdclient.truststore.path     = truststore/2025/smp-test-truststore.p12
# For the production Directory
#pdclient.truststore.path     = truststore/2025/smp-prod-truststore.p12
pdclient.truststore.password = peppol

## TLS settings

# "true" (the default) disables the https hostname verification
https.hostname-verification.disabled = false

## HTTP proxy - optional

# These properties are evaluated by ph-httpclient, so they are the same ones as in the other
# Peppol components. The proxy is only used if the host AND the port are set. The proxy
# credentials are only used if the username AND the password are set.
#http.proxy.enabled       = true
#http.proxy.host          = proxy.example.org
#http.proxy.port          = 8080
#http.proxy.username      = proxy-user
#http.proxy.password      = proxy-password
# Pipe separated list of hosts to be contacted directly
#http.proxy.nonProxyHosts = localhost|127.0.0.1|*.example.org

# Each of the properties above may also be prefixed with "pdclient." - the prefixed name is
# evaluated first. Use this to let the PD client use a different proxy than the rest of the
# application, or to give it a proxy at all, if the other components use none.
#pdclient.http.proxy.host = pd-proxy.example.org
#pdclient.http.proxy.port = 8888

## HTTP timeouts - optional

# Timeout in milliseconds. 0 means indefinite, -1 means "system default"
#http.connect.timeout.ms  = 5000
#http.response.timeout.ms = 10000

## Deprecated legacy property names - do not use for new setups

# Replaced by "http.proxy.username" and "http.proxy.password"; using them logs a warning
#proxy.username = proxy-user
#proxy.password = proxy-password
